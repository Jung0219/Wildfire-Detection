# Example config for MR modular pipeline
# Paths
# For single_run.py, set image_path; batch runners may still use image_dir.
image_dir:  /lab/projects/fire_smoke_awr/data/detection/training/AD_phash3_early_smoke/original/images/test
output_dir: /lab/projects/fire_smoke_awr/outputs/yolo/detection/pyro-sdis/phash10/900/test/full_pipeline/pipeline
# Models
DetectorWeights: /lab/projects/fire_smoke_awr/outputs/yolo/detection/pyro-sdis/phash10/900/train/weights/best.pt
# ClassifierWeights: /lab/projects/fire_smoke_awr/outputs/yolo/classification/AD_phash3_early_smoke/train/weights/best.pt
ClassifierWeights: /lab/projects/fire_smoke_awr/outputs/eva02/AD_phash3_early_smoke/train/weights/best_loss.pt
ClassifierType: eva  # yolo or eva
# Thresholds
conf_low: 0.6
conf_high: 0.7
nms_iou_thresh: 0.45
# Geometry
intermediate_size: 800 # this has to match the detector
anchor_y_frac: 0.6
classifier_crop_size: 224
# Flags
save_debug: false
save_composites: false
