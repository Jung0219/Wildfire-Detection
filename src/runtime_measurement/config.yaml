# Example config for MR modular pipeline
# Paths
# For single_run.py, set image_path; batch runners may still use image_dir.
image_path: /lab/projects/fire_smoke_awr/data/detection/training/AD_early_smoke/original/images/test/AoF05339.jpg
output_dir: /lab/projects/fire_smoke_awr/src/runtime_measurement/test
# Models
DetectorWeights: /lab/projects/fire_smoke_awr/outputs/yolo/detection/pyro-sdis/phash10/900/train/weights/best.pt
ClassifierWeights: /lab/projects/fire_smoke_awr/outputs/yolo/classification/pyro_sdis/224x224/train/weights/best.pt
# ClassifierWeights: /lab/projects/fire_smoke_awr/outputs/eva02/AD_phash3_early_smoke/train/weights/best_loss.pt
ClassifierType: yolo  # yolo or eva
# Thresholds
conf_low: 0.00
conf_high: 1
nms_iou_thresh: 0.45
# Geometry
intermediate_size: 900 # this has to match the detector
anchor_y_frac: 0.25
classifier_crop_size: 224
# Flags
save_debug: false
save_composites: false
